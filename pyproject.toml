[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moleditpy-openbabel-optimizer"
version = "1.0.0a1"
description = "Optional, isolated Open Babel force-field optimization for MoleditPy 5"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "HiroYokoyama"}]
dependencies = []

[project.optional-dependencies]
engine = ["openbabel>=3.2.1,<3.3"]
test = ["pytest", "pytest-qt", "PySide6-Essentials<6.12", "rdkit<2026.4"]

[tool.setuptools.packages.find]
include = ["openbabel_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
